<app-filter
  searchLabel="Busqueda por nombre de cliente"
  [(searchingText)]="filterCustomerName"
  [showonConfirmButton]="true"
  confirmButtonText="Buscar"
  (onApply)="loadOrders()"
  (onClear)="clearFilters()">
  <div class="purchase-orders__filters">
    <div>
      <label for="filterId">Código</label>
      <input id="filterId" type="number" [value]="filterId() ?? ''" (input)="filterId.set(+$any($event.target).value || null)">
    </div>

    <div>
      <label for="filterPhone">Teléfono</label>
      <input id="filterPhone" type="text" [value]="filterPhone()" (input)="filterPhone.set($any($event.target).value)" />
    </div>

    <div>
      <label for="filterDateFrom">Fecha desde</label>
      <input id="filterDateFrom" type="date" [value]="filterDateFrom()" (input)="filterDateFrom.set($any($event.target).value)" />
    </div>

    <div>
      <label for="filterDateTo">Fecha hasta</label>
      <input id="filterDateTo" type="date" [value]="filterDateTo()" (input)="filterDateTo.set($any($event.target).value)" />
    </div>

    <div>
      <label for="filterTotalFrom">Precio mínimo</label>
      <input id="filterTotalFrom" type="number" [value]="filterTotalFrom() ?? ''" (input)="filterTotalFrom.set(+$any($event.target).value || null)" />
    </div>

    <div>
      <label for="filterTotalTo">Precio máximo</label>
      <input id="filterTotalTo" type="number" [value]="filterTotalTo() ?? ''" (input)="filterTotalTo.set(+$any($event.target).value || null)" />
    </div>
  </div>
</app-filter>

<app-table
  [data]="orders()"
  [columns]="columns"
  [showInfo]="true"
  (rowDeactivate)="onViewOrder($event)"
  emptyMessage="No hay órdenes registradas"
/>

<app-modal
  modalTitle="Detalle de la orden"
  [(showModal)]="showModal"
  [showConfirmButton]="false"
  [showCancelButton]="false"
  cancelLabel="Cerrar">
  @if (selectedOrder(); as order) {
    <div class="order-info">
      <div class="order-info__row">
        <strong>Cliente:</strong>
        <span>{{ order.customerName }}</span>
      </div>
      <div class="order-info__row">
        <strong>Teléfono:</strong>
        <span>{{ order.customerPhoneNumber }}</span>
      </div>     
      <div class="order-info__row">
        <strong>Email:</strong>
        <span>{{ order.customerEmail }}</span>
      </div>      
      <div class="order-info__row">
        <strong>Dirección:</strong>
        <span>{{ order.customerAddress }}</span>
      </div>

      <app-table
      [data]="order.purchaseOrderProduct"
      [columns]="orderProductColumns"
      emptyMessage="Sin Productos"
      />
    </div>

  }
</app-modal>
