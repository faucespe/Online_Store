<!-- Barra de filtros y estados -->
<app-filter
  [(searchingText)]="filterName"
  [showonConfirmButton]="true"
  confirmButtonText="Buscar"
  (onApply)="loadCategories()"
  (onClear)="clearFilters()"
>
  <select [value]="filterStatusId() ?? 2" (change)="filterStatusId.set(+$any($event.target).value)">
    <option value="">Filtrar por estado</option>
    @for (status of statuses(); track status.id) {
      <option [value]="status.id">{{ status.name }}</option>
    }
  </select>
</app-filter>

<!-- Titulo de la pagina y boton de Crear categoria -->
<div class="create-category">
  <app-button color="primary" icon="add" shape="rounded" (click)="openCreateModal()" />
</div>

<!-- Tabla de categorias -->
<app-table
    [data]="categories()"
    [columns]="columns"
    [showActions]="true"
    [actionLabel]="'Actualizar'"
    (rowActions)="onEditCategory($any($event))"
    emptyMessage="No hay categorías registradas"
/>

<!-- modal de crear y actualizar categoria-->
<app-modal
    [modalTitle]="editMode() ? 'Actualizar categoría' : 'Crear categoría'"
    [(showModal)]="showModal"
    [confirmLabel]="editMode() ? 'Actualizar' : 'Crear'"
    [cancelLabel]="'Cancelar'"
    (onConfirm)="saveCategory()">

    @if (backendError()) {
        <p class="backend-error">{{ backendError() }}</p>
    }

    <!-- espacio de nombre en el modal -->
    <label>
        Nombre
        <input
            type="text"
            [value]="editName()"
            (input)="editName.set($any($event.target).value)"
        />
    </label>

    <!-- espacio de Estado en el modal -->
    <label>
        Estado
        <select [value]="editStatusId() ?? ''" (change)="editStatusId.set(+$any($event.target).value)">
            <option value="" disabled>Seleccione un estado</option>
            @for (status of statuses(); track status.id){
                <option [value]="status.id">{{ status.name}}</option>
            }
        </select>
    </label>
</app-modal>
