<div class="select-field">
  @if (label()) {
  <label [for]="name()">
    {{ label() }}
  </label>
  }
  <select [id]="name()" [name]="name()" [value]="model()?.id ?? ''" (change)="onModelChange($any($event.target).value)">
    @if (showAnyOption()) {
    <option value="" [selected]="!model()">Cualquiera</option>
    } @else {
    <option value="" disabled [selected]="!model()">
      {{ placeholder() }}
    </option>
    }
    @for (option of options(); track option.id) {
    <option [value]="option.id">
      {{ option.name }}
    </option>
    }
  </select>
</div>
