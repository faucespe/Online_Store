<div class="filter">
  <div class="filter__container">
    <app-button icon="tune" shape="rounded" (click)="toggleFilter()"/>
    <input
      class="filter__search-bar"
      type="text"
      placeholder="Buscar"
      [value]="searchingText()"
      (input)="onInputText($event)"
    />
    @if (showonConfirmButton()) {
      <app-button [buttonText]="confirmButtonText()" (click)="applyFilter()"/>
    }
  </div>

  @if (showPopover()) {
    <div class="filter__popover">
      <ng-content></ng-content>
      <div class="filter__popover-actions">
        <app-button color="secondary" buttonText="Limpiar Filtro" (click)="clearFilter()"/>
        <app-button color="secondary" [buttonText]="cancelButtonText()" (click)="showPopover.set(false)"/>
      </div>
    </div>
  }
</div>
