<div class="select-field">
  @if (label) {
    <label [for]="name"> {{ label }} </label>
  }
  <select
    [id]="name"
    [name]="name"
    [value]="model?.id ?? ''"
    (change)="onModelChange($any($event.target).value)"
  >
    <option value="">
      Seleccione una opción
    </option>
    @for (option of options; track option.id) {
      <option [value]="option.id">
        {{ option.name }}
      </option>
    }
  </select>
</div>
