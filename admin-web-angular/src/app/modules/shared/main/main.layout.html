<header class="main__header">
  <figure>
    <a routerLink="/">
      <img class="main__header-logo" src="/public/img/logo.svg" alt="QuickBuy logo">
    </a>
  </figure>

  <h1>Web de Administración</h1>
<div class="main__actions-container">
    <app-button color="secondary" icon="menu" (click)="toggleMenu()"></app-button>
    
    @if (menuOpen()) {
      <nav class="menu-options">
        <a routerLink="/purchase-orders">Página Principal</a>
        <a routerLink="/products">Productos</a>
        <a routerLink="/categories">Categorías</a>
      </nav>
    }
  </div>
</header>

<section class="wrapper">
    <nav class="sidenav">
    <h3 class="category">Menú Principal</h3>
    <ul class="list">
      <li>
        <a routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >Página Principal
        </a>
      </li>
      <li>
        <a routerLink="/products"
          routerLinkActive="active"
          >Productos</a>
      </li>
      <li> 
        <a routerLink="/categories"
        routerLinkActive="active"
        >Categorías</a>
      </li>
    </ul>
  </nav>

  <main>
  <router-outlet></router-outlet>

  </main>
</section>
