<div class="store-filter">
    <div class="store-filter__container">
        <app-store-btn icon="tune" shape="rounded" (click)="showPopover.set(showPopover() ? false : true)" />
        <input (input)="onInputText($event)" [value]="searchingText()" class="store-filter__search-bar" type="text" placeholder="Buscar">
    </div>
    @if (showPopover()) {
        <div class="store-filter__popover">
            <ng-content></ng-content>
            <div class="store-filter__popover-actions">
                @if (showonConfirmButton()) {
                    <app-store-btn (click)="handleConfirm()" [buttonText]="confirmButtonText()"></app-store-btn>
                }
                <app-store-btn (click)="showPopover.set(false)" [buttonText]="cancelButtonText()" color="secondary"></app-store-btn>
            </div>
        </div>
    }
</div>
